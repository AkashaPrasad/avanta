# TLS terminator in front of the API.
#
# Cloudflare proxies this origin in "Full" SSL mode, which means it connects
# over HTTPS on 443 and does not validate the origin certificate. A
# self-signed certificate is therefore sufficient and is generated on first
# boot. For "Full (strict)" the right move is a Cloudflare Origin CA
# certificate mounted at the same paths -- nothing else here changes.

upstream avanta_api {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    # Cloudflare always reaches us over 443; plain HTTP is only ever a health
    # probe or a misconfiguration, so answer it rather than redirecting into a
    # loop behind the proxy.
    location /api/v1/health { proxy_pass http://avanta_api; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 32m;

    # Attribution jobs are asynchronous -- the client submits and polls -- so no
    # single request should be long. These are generous enough for a cold scene
    # ingest without masking a hang.
    proxy_connect_timeout 15s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    gzip on;
    gzip_types application/json application/geo+json text/plain;
    gzip_min_length 1024;

    location / {
        proxy_pass http://avanta_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # The job progress stream is a websocket.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
