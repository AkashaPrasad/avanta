line-length = 110
target-version = "py310"   # the dev venv is 3.10; the container is 3.11

[lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
  "E501",    # long lines are reported by the formatter, not worth failing a build over
  "B008",    # FastAPI's Depends() in a default argument is the documented idiom
  "SIM105",  # contextlib.suppress is not clearer than a two-line try/except here
]

[lint.per-file-ignores]
"tests/**" = ["B011"]
"scripts/**" = ["E402"]   # sys.path is set up before the local imports, deliberately
