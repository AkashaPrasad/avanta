# AVANTA runtime configuration. Every threshold that affects a result lives here,
# never in code, so the dossier can cite the exact value that produced a number.
version: "1.0.0"

sar:
  # Probed at startup; the published examples have used both of these.
  process_url_candidates:
    - "https://sh.dataspace.copernicus.eu/api/v1/process"
    - "https://sh.dataspace.copernicus.eu/process/v1"
  catalog_url: "https://sh.dataspace.copernicus.eu/api/v1/catalog/1.0.0/search"
  token_url: "https://identity.dataspace.copernicus.eu/auth/realms/CDSE/protocol/openid-connect/token"
  collection: "sentinel-1-grd"
  acquisition_mode: "IW"
  polarization: "DV"
  resolution: "HIGH"
  back_coeff: "SIGMA0_ELLIPSOID"
  dem_instance: "COPERNICUS_30"
  orthorectify: true
  # Output raster size. Sentinel-1 IW GRD is 10 m native, so a 1° box at 1024 px
  # is ~107 m/pixel and visibly falls apart when an analyst zooms in to inspect a
  # slick edge. 2048 gives ~54 m/pixel, which holds up at working zoom levels.
  # Sentinel Hub bills Processing Units by output pixel count, so this is 4x the
  # cost of 1024 (~43 PU against ~11) -- comfortably inside the free monthly
  # allowance, and every response is cached by content hash and never refetched.
  width: 2048
  height: 2048
  request_timeout_s: 180

detect:
  # Speckle filter
  speckle_sigma_px: 1.2
  # Adaptive threshold: a pixel is dark if it sits this many dB below the local
  # background. The window is specified in KILOMETRES, not pixels, and converted
  # using the scene's own resolution. A fixed pixel count changes physical size
  # with resolution, and once the window is comparable to the slick the slick is
  # absorbed into its own background estimate and its contrast vanishes -- a
  # detector that silently stops working as you zoom in.
  local_window_km: 12.0
  local_window_min_px: 31
  local_window_max_px: 401
  dark_offset_db: 2.6
  min_area_px: 220
  # Look-alike discrimination. Each is reported individually in the UI.
  # Look-alike discrimination. Each test is reported individually with its own
  # value, threshold and weight, so an analyst can see which one carried the
  # decision. Weights are expert-set and published, not fitted.
  lookalike:
    decision_threshold: 0.55     # weighted score at or above this is called oil
    tests:
      elongation:
        threshold: 2.0           # PCA major/minor axis ratio
        weight: 1.4
      perimeter_area_ratio:
        threshold: 5.5           # perimeter / sqrt(area); ragged natural films score high
        weight: 0.6
      edge_sharpness_ratio:
        # Boundary gradient divided by the 90th-percentile gradient of
        # undisturbed sea in the same scene. Provisional: recalibrated against
        # the synthetic set, which has exact ground truth, by
        # scripts/make_synthetic_set.py --calibrate-detector.
        threshold: 1.25
        weight: 1.3
      contrast_db:
        threshold: 2.0           # damping below this is within sea-surface variability
        weight: 1.0
      infrastructure_distance_km:
        threshold: 3.0
        weight: 0.7

# A Sentinel-1 request returns the intersection of the bbox with the satellite's
# swath, so a box placed off the pass comes back mostly empty. Reporting "no
# slick" over a raster that is largely no-data reads as "this area is clean"
# when the truth is that most of it was never imaged.
coverage:
  min_fraction: 0.60   # below this the scene is reported as partially imaged

windgate:
  # Below the lower bound the sea is too smooth for a slick to show contrast;
  # above the upper bound wind mixes oil into the water column.
  min_ms: 3.0
  max_ms: 10.0

ais:
  gap_min_minutes: 20.0
  resample_minutes: 5.0
  max_track_age_hours: 72.0

prefilter:
  keep_top_k: 8
  max_drift_speed_ms: 1.0        # feasibility cone upper bound, NOT reverse drift
  search_radius_km: 200.0

simulate:
  n_per_point: 60
  seed_radius_m: 200.0
  time_step_s: 600
  output_step_s: 1800
  horizontal_diffusivity: 10.0
  wind_drift_factor: 0.03
  n_ensemble: 12
  ensemble_perturbation:
    wind_speed_frac: 0.15
    wind_direction_deg: 10.0
    current_frac: 0.20
    wind_drift_factor_range: [0.025, 0.035]
    diffusivity_range: [5.0, 20.0]
  # The likelihood is profiled over release start and duration. It is NOT
  # profiled over discharge rate: the simulated density is normalised before
  # comparison, so scaling the released volume leaves the fit essentially
  # unchanged. Rate is weakly identified from slick geometry alone, and
  # pretending otherwise would mean reporting three identical simulations as
  # three distinct hypotheses. The rate below sets the released volume, which is
  # what the dossier and the OOSA handoff carry, and it is reported as an
  # order-of-magnitude estimate rather than a fitted quantity.
  theta_grid:
    duration_hours: [1.0, 2.0, 4.0]
    lead_hours: [3.0, 6.0, 12.0, 24.0]   # release start, hours before acquisition
    rate_m3_per_h: [4.0]

score:
  epsilon: 0.05                  # robustness floor in the likelihood mixture
  beta: 1.4                      # penalty on simulated oil outside the observed mask
  kernel_sigma_px: 3.0
  null_prior_logit: 0.0          # log pi_0 for the H0 hypothesis
  h0_display_threshold: 0.5
  # Support for the unknown-source null, as a multiple of the observed slick's
  # own extent. H0 means "a source we never saw put oil here", so its oil must
  # be spread over the envelope such a source could have drifted into -- not
  # over the slick's own footprint. Dilating by roughly the slick size makes the
  # null a near-perfect fit to the very thing it is supposed to be an
  # alternative to, and it then beats real candidates on tightly defined slicks.
  # Too large and H0 can never win, which removes the system's ability to
  # decline. Calibrated against the synthetic set and its negative controls.
  null_envelope_extents: 3.0
  # Adjacent pixels in a 10 m SAR image are not independent observations, and a
  # log-likelihood summed over a million correlated cells saturates the softmax
  # so that every answer is 0.000 or 1.000. The sum is therefore divided by the
  # number of cells inside one smoothing kernel, which is the scale over which
  # the density field is genuinely correlated. Set `auto` to derive it from
  # kernel_sigma_px, or a number to override.
  likelihood_temperature: auto
  likelihood_grid_downsample: 4  # evaluate the likelihood on a coarser grid

performance_budgets_s:
  scene_ingest_cached: 1.5
  scene_ingest_live: 25.0
  segmentation: 6.0
  prefilter: 1.5
  attribution_cpu: 90.0
  dossier: 5.0
